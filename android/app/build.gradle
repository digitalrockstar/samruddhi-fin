plugins { id 'com.android.application' }
android {
    namespace 'in.samruddhi.app'
    compileSdk 34
    defaultConfig {
        applicationId 'in.samruddhi.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '2.0'
        buildConfigField 'String', 'APP_URL', "\"${project.findProperty('APP_URL')}\""
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
