{% extends "base.html" %}

{% block content %}
<div x-data="formatsPage()" x-init="load()" class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <div>
      <h1 class="text-xl font-semibold text-gray-900 dark:text-white">SMS formats to review</h1>
      <p class="text-sm text-gray-500" x-text="data ? data.pending_formats + ' formats, ' + data.pending_messages + ' messages waiting' : 'Loading...'"></p>
    </div>
    <button class="btn btn-secondary" @click="showDecided = !showDecided; if (showDecided) loadDecided()"
            x-text="showDecided ? 'Back to queue' : 'My decisions'"></button>
  </div>

  <div x-show="!showDecided" class="space-y-3">
    <template x-for="it in (data?.items || [])" :key="it.skeleton">
      <div class="stat-card space-y-3">
        <p class="text-sm break-words text-gray-900 dark:text-gray-100" x-text="it.example"></p>
        <p class="text-xs text-gray-500">
          <span x-text="it.count"></span> message(s) like this
          <span x-show="it.amount > 0"> · amount read: ₹<span x-text="it.amount"></span></span>
        </p>
        <div class="flex flex-wrap gap-2 items-center">
          <button class="btn btn-secondary" @click="decide(it, 'ignore')">Not a transaction</button>
          <button class="btn btn-primary" @click="decide(it, 'debit')">Debit</button>
          <button class="btn btn-primary" @click="decide(it, 'credit')">Credit</button>
          <button class="btn btn-secondary" @click="decide(it, 'transfer')">Own transfer</button>
          <select class="form-input w-auto" x-model="modes[it.skeleton]">
            <option value="">Mode: auto</option>
            <option value="upi">UPI</option><option value="card">Card</option>
            <option value="netbanking">Netbanking</option><option value="imps">IMPS</option>
            <option value="neft">NEFT</option><option value="atm">ATM</option>
            <option value="wallet">Wallet</option><option value="cash">Cash</option>
          </select>
        </div>
      </div>
    </template>
    <p x-show="data && !data.items.length" class="text-sm text-gray-500">Nothing waiting. New formats appear here.</p>
  </div>

  <div x-show="showDecided" class="stat-card p-0 overflow-hidden">
    <table class="w-full transaction-table">
      <thead><tr><th>Format starts with</th><th>Decision</th><th></th></tr></thead>
      <tbody>
        <template x-for="d in decided" :key="d.id">
          <tr>
            <td class="text-xs font-mono" x-text="d.skeleton"></td>
            <td class="text-xs" x-text="d.decision + (d.mode ? ' · ' + d.mode : '')"></td>
            <td><button class="btn btn-secondary" @click="undo(d)">Undo</button></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>

<script>
function formatsPage() {
  return {
    data: null, decided: [], showDecided: false, modes: {},
    async load() { this.data = await api('/api/formats/queue'); },
    async loadDecided() { this.decided = await api('/api/formats/decided'); },
    async decide(it, decision) {
      const mode = ['debit', 'credit'].includes(decision) ? (this.modes[it.skeleton] || null) : null;
      try {
        const r = await api('/api/formats/decide', { method: 'POST', body: JSON.stringify({ skeleton: it.skeleton, decision, mode }) });
        showToast(decision === 'ignore' ? 'Ignored ' + it.count + ' message(s)' : r.created + ' transaction(s) created', 'success');
        await this.load();
      } catch (e) { showToast(e.message, 'error'); }
    },
    async undo(d) {
      try { await api('/api/formats/' + d.id, { method: 'DELETE' }); await this.loadDecided(); await this.load(); }
      catch (e) { showToast(e.message, 'error'); }
    },
  };
}
</script>
{% endblock %}
