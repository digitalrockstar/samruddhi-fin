<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Samruddhi Fin{% endblock %}</title>

    <script>
(function () {
  const saved = (function(){try{return localStorage.getItem('theme')}catch(e){return null}})();
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
})();
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',
                400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',
                800:'#166534',900:'#14532d'
              }
            }
          }
        }
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/style.css">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors">

<nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="wallet" class="w-6 h-6 text-primary-600"></i>
        <span class="text-lg font-bold text-gray-900 dark:text-white">Samruddhi&nbsp;Fin</span>
      </div>

      <div class="hidden md:flex items-center gap-1" id="desktop-nav">
        <a href="/"        class="nav-link px-3 py-2 rounded-lg text-sm font-medium" data-nav="/">Dashboard</a>
        <a href="/transactions" class="nav-link px-3 py-2 rounded-lg text-sm font-medium" data-nav="/transactions">Transactions</a>
        <a href="/uncategorized" class="nav-link px-3 py-2 rounded-lg text-sm font-medium" data-nav="/uncategorized">Review</a>
        <a href="/formats" class="nav-link px-3 py-2 rounded-lg text-sm font-medium" data-nav="/formats">SMS formats</a>
        <a href="/settings" class="nav-link px-3 py-2 rounded-lg text-sm font-medium" data-nav="/settings">Settings</a>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" onclick="toggleTheme()" aria-label="Toggle theme" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700" title="Toggle theme">
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
        </button>

        <!-- Who am I -->
        <div x-data="{ open:false }" class="relative">
          <button @click="open = !open" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <i data-lucide="user" class="w-4 h-4"></i>
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300" x-text="$store.user.name"></span>
            <i data-lucide="chevron-down" class="w-4 h-4"></i>
          </button>
          <div x-show="open" @click.outside="open=false" x-cloak x-transition
               class="absolute right-0 mt-2 w-56 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 py-1 z-40">
            <template x-for="p in $store.user.persons" :key="p.id">
              <button @click="$store.user.select(p); open=false"
                      class="w-full px-4 py-2 text-left hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2">
                <span class="text-xs font-mono text-gray-400" x-text="p.prefix"></span>
                <span class="text-sm" x-text="p.name"></span>
                <i x-show="p.id === $store.user.id" data-lucide="check" class="w-4 h-4 ml-auto text-primary-600"></i>
              </button>
            </template>
          </div>
        </div>

      </div>
    </div>

  </div>
</nav>

<main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-28 md:pb-6">
  {% block content %}{% endblock %}
</main>

<nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700"
     style="padding-bottom: env(safe-area-inset-bottom, 0px)" aria-label="Main">
  <div class="grid grid-cols-5">
    <a href="/" data-nav="/" class="bnav-link flex flex-col items-center justify-center py-2 text-[11px] text-gray-500 dark:text-gray-400"><i data-lucide="layout-dashboard" class="w-5 h-5 mb-0.5"></i><span>Home</span></a>
    <a href="/transactions" data-nav="/transactions" class="bnav-link flex flex-col items-center justify-center py-2 text-[11px] text-gray-500 dark:text-gray-400"><i data-lucide="receipt" class="w-5 h-5 mb-0.5"></i><span>Txns</span></a>
    <a href="/uncategorized" data-nav="/uncategorized" class="bnav-link flex flex-col items-center justify-center py-2 text-[11px] text-gray-500 dark:text-gray-400"><i data-lucide="tags" class="w-5 h-5 mb-0.5"></i><span>Review</span></a>
    <a href="/formats" data-nav="/formats" class="bnav-link flex flex-col items-center justify-center py-2 text-[11px] text-gray-500 dark:text-gray-400"><i data-lucide="list-checks" class="w-5 h-5 mb-0.5"></i><span>Formats</span></a>
    <a href="/settings" data-nav="/settings" class="bnav-link flex flex-col items-center justify-center py-2 text-[11px] text-gray-500 dark:text-gray-400"><i data-lucide="settings" class="w-5 h-5 mb-0.5"></i><span>Settings</span></a>
  </div>
</nav>

<div id="toast-container" class="fixed bottom-20 md:bottom-4 right-4 z-50 space-y-2"></div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  html.classList.toggle('dark');
  localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
}
function showToast(message, type = 'info') {
  const colors = { success:'bg-green-600', error:'bg-red-600', warning:'bg-yellow-600', info:'bg-blue-600' };
  const el = document.createElement('div');
  el.className = `${colors[type]||colors.info} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 animate-slide-in text-sm`;
  el.innerHTML = `<span class="flex-1"></span><button class="opacity-70 hover:opacity-100">&times;</button>`;
  el.querySelector('span').textContent = message;
  el.querySelector('button').onclick = () => el.remove();
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}
function markActiveNav() {
  const path = window.location.pathname;
  document.querySelectorAll('[data-nav]').forEach(a => {
    a.classList.toggle('active', a.dataset.nav === path);
  });
}
document.addEventListener('DOMContentLoaded', () => {
  markActiveNav();
  if (window.lucide) lucide.createIcons();
});
</script>
<script src="/static/js/app.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
