{% extends 'base.html' %}{% block content %}<h1>Auto-tag spot check</h1>{% for review,raw in rows %}<article><small>{{ raw.message_date }} | #{{ raw.message_id }}</small><code>{{ raw.text }}</code><p>Tag ID: {{ review.tag_id }} | Format ID: {{ review.format_id }}</p><form method="post" action="/review/{{ review.id }}/undo"><button>Undo and review</button></form></article>{% else %}<p>No auto-tagged messages yet.</p>{% endfor %}{% endblock %}
