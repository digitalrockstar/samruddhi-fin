{% extends 'base.html' %}{% block content %}<h1>Confirm transaction</h1><article><code id="sms">{{ raw.text }}</code><p>Select text in the SMS, then enter the field name when prompted.</p><form method="post"><label>Amount <input name="amount" id="amount" required></label><input type="hidden" name="amount_start" id="amount_start"><input type="hidden" name="amount_end" id="amount_end"><br><label>Merchant <input name="merchant" id="merchant"></label><input type="hidden" name="merchant_start" id="merchant_start"><input type="hidden" name="merchant_end" id="merchant_end"><br><label>Reference <input name="reference_number" id="reference"></label><input type="hidden" name="reference_start" id="reference_start"><input type="hidden" name="reference_end" id="reference_end"><br><label>Balance <input name="balance" id="balance"></label><input type="hidden" name="balance_start" id="balance_start"><input type="hidden" name="balance_end" id="balance_end"><br><label>Direction <select name="direction"><option>debit</option><option>credit</option><option>own transfer</option></select></label><br><label>Mode <select name="mode"><option></option><option>UPI</option><option>card</option><option>netbanking</option><option>IMPS</option><option>NEFT</option><option>ATM</option><option>wallet</option><option>cash</option></select></label><br><label>Account <input name="account"></label><br><label>Owner <input name="owner"></label><br><label><input type="checkbox" name="learn" value="true" checked> Learn this format</label><button>Save transaction</button></form></article><script>document.getElementById('sms').addEventListener('mouseup',()=>{const s=window.getSelection();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0),el=document.getElementById('sms');const pre=r.cloneRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const start=pre.toString().length;const end=start+r.toString().length;const f=prompt('Field: amount, merchant, reference, balance, direction');if(f&&['amount','merchant','reference','balance','direction'].includes(f)){document.getElementById(f).value=r.toString();document.getElementById(f+'_start').value=start;document.getElementById(f+'_end').value=end;}});</script>{% endblock %}
