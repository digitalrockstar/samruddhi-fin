<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up family · Samruddhi</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-body"><form class="panel login-panel" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="brand-mark">s<span>.</span></div><div class="eyebrow">FAMILY FINANCE</div><h1>Create your family workspace.</h1><p>Set up the first administrator login. Each family member can have a separate login after setup.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<label class="field"><span>YOUR NAME</span><input name="name" maxlength="100" autocomplete="name" required autofocus></label><label class="field"><span>EMAIL</span><input type="email" name="email" maxlength="254" autocomplete="email" required></label><label class="field"><span>PASSWORD · MINIMUM 10 CHARACTERS</span><input type="password" name="password" minlength="10" autocomplete="new-password" required></label><label class="field"><span>CONFIRM PASSWORD</span><input type="password" name="confirm_password" minlength="10" autocomplete="new-password" required></label><button class="icon-button primary" type="submit" aria-label="Create workspace" title="Create workspace">✓</button></form><script src="{{ url_for('static', filename='app.js') }}" defer></script></body></html>
