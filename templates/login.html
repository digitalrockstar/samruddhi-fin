<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Samruddhi</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-body"><form class="panel login-panel" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="brand-mark">s<span>.</span></div><div class="eyebrow">FAMILY FINANCE</div><h1>Welcome back.</h1><p>Sign in with your own family-member login.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<label class="field"><span>EMAIL</span><input type="email" name="email" autocomplete="username" required autofocus></label><label class="field"><span>PASSWORD</span><input type="password" name="password" autocomplete="current-password" required></label><button class="icon-button primary" type="submit" aria-label="Sign in" title="Sign in">✓</button></form><script src="{{ url_for('static', filename='app.js') }}" defer></script></body></html>
