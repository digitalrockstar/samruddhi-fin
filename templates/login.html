<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Samruddhi</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-body"><form class="panel login-panel" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="brand-mark">s<span>.</span></div><div class="eyebrow">PERSONAL FINANCE</div><h1>Welcome back.</h1><p>Sign in to view your household finances.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<label class="field"><span>PASSWORD</span><input type="password" name="password" required autofocus></label><button class="button primary full-button" type="submit">Sign in →</button></form><script src="{{ url_for('static', filename='app.js') }}" defer></script></body></html>
