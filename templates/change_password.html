{% extends "base.html" %}
{% block title %}Change password{% endblock %}{% block content %}
<section class="page-heading"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p class="subheading">Use a personal password that only you know.</p></div></section>
<section class="panel password-panel"><div class="panel-heading"><div><h2>{{ member.name }}</h2><p>{{ member.email }} · {{ member.role|title }}</p></div></div>
<form method="post" class="stack-form" autocomplete="off"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label class="field"><span>CURRENT PASSWORD</span><input type="password" name="old_password" autocomplete="current-password" required></label><label class="field"><span>NEW PASSWORD · MINIMUM 10 CHARACTERS</span><input type="password" name="new_password" minlength="10" autocomplete="new-password" required></label><label class="field"><span>CONFIRM NEW PASSWORD</span><input type="password" name="confirm_password" minlength="10" autocomplete="new-password" required></label><div class="inline-icon-actions"><a class="icon-button quiet" href="{{ url_for('dashboard') }}" title="Cancel" aria-label="Cancel">×</a><button class="icon-button primary" type="submit" title="Save password" aria-label="Save password">✓</button></div></form></section>
{% endblock %}
