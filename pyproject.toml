[project]
name = "samruddhi-fin"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.7,<3",
  "telethon>=1.38,<2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "aiosqlite>=0.20,<1]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
