<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
<title id="title">Samruddhi Finance</title>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0a8"/>
    <stop offset=".28" stop-color="#f8d46d"/>
    <stop offset=".62" stop-color="#d99a2b"/>
    <stop offset=".82" stop-color="#ffdf7d"/>
    <stop offset="1" stop-color="#9c6214"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3bd"/>
    <stop offset="1" stop-color="#a86614"/>
  </linearGradient>
  <filter id="emboss" x="-25%" y="-25%" width="150%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation=".55" result="blur"/>
    <feOffset in="blur" dx=".45" dy=".8" result="shadow"/>
    <feFlood flood-color="#6f4308" flood-opacity=".9" result="shadowColor"/>
    <feComposite in="shadowColor" in2="shadow" operator="in" result="shadowShape"/>
    <feMerge><feMergeNode in="shadowShape"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="64" height="64" fill="#050505"/>
<g filter="url(#emboss)">
  <path d="M17.5 24.5 32 12.7 46.5 24.5" fill="none" stroke="#8f5a12" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17.5 23.8 32 12 46.5 23.8" fill="none" stroke="url(#gold)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="32" y="50.5" text-anchor="middle" font-family="Arial, 'Noto Sans', sans-serif" font-size="27" font-weight="600" fill="url(#gold)" stroke="#a56c18" stroke-width=".35" paint-order="stroke fill">₹</text>
</g>
</svg>